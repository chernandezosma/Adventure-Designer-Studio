# ADS IDE Color Theme
# Edit any value and restart the application to apply changes.
# Format: TOKEN_NAME = #RRGGBBAA  (hexadecimal, 00-ff per channel)
# Lines starting with # or ; are comments.

[Backgrounds]
BG0       = #0f1117ff  # base app background
BG1       = #161b24ff  # panel backgrounds
BG2       = #1e2533ff  # hover state
BG3       = #252d3eff  # active / selected

[Borders]
BORDER    = #2e3a50ff  # default border
BORDER_HI = #3d4f6eff  # focused / highlighted border

[Text]
TEXT0     = #e8e6dfff  # primary text
TEXT1     = #b8b4a8ff  # secondary text
TEXT2     = #5a6275ff  # muted / disabled labels

[EntityAccents]
C_SCENE   = #7b9dffff  # scenes
C_NPC     = #d4667aff  # characters / NPCs
C_ITEM    = #5bc4a0ff  # objects / items
C_PUZZLE  = #e8a44aff  # puzzles
C_VAR     = #b07cffff  # variables
C_AUDIO   = #f08a5dff  # audio

[StateIndicators]
C_ERROR   = #e05252ff  # error
C_WARN    = #e8a44aff  # warning
C_OK      = #5bc4a0ff  # ok / success
