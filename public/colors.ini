# ADS IDE Color Theme
# Edit any value and restart the application to apply changes.
# Format: TOKEN_NAME = #RRGGBBAA  (hexadecimal, 00-ff per channel)
# Lines starting with # or ; are comments.
#
# Two areas below: DARK THEME and LIGHT THEME. Section names are
# organisational only — any section whose name contains "light" feeds
# the light theme, every other section feeds the dark theme.

# ====================================================================
#  DARK THEME
# ====================================================================

[Dark.Backgrounds]
BG0       = #0f1117ff  # base app background
BG1       = #161b24ff  # panel backgrounds
BG2       = #1e2533ff  # hover state
BG3       = #252d3eff  # active / selected

[Dark.Borders]
BORDER    = #2e3a50ff  # default border
BORDER_HI = #3d4f6eff  # focused / highlighted border

[Dark.Text]
TEXT0     = #e8e6dfff  # primary text
TEXT1     = #b8b4a8ff  # secondary text
TEXT2     = #5a6275ff  # muted / disabled labels

[Dark.EntityAccents]
C_SCENE   = #7b9dffff  # scenes
C_NPC     = #d4667aff  # characters / NPCs
C_ITEM    = #5bc4a0ff  # objects / items
C_PUZZLE  = #e8a44aff  # puzzles
C_VAR     = #b07cffff  # variables
C_AUDIO   = #f08a5dff  # audio
C_STATE   = #adda68ff  # states
C_CHAIN   = #5dc9d3ff  # state chains

[Dark.StateIndicators]
C_ERROR   = #e05252ff  # error
C_WARN    = #e8a44aff  # warning
C_OK      = #5bc4a0ff  # ok / success

[Dark.Dialogs]
C_DIALOG_TITLE = #2f5fb0ff  # modal caption bar
C_PANEL_TITLE  = #1c3a63ff  # docked panel caption + dock tab
C_CAPTION_TEXT = #f0f3f7ff  # text on the caption bars

# ====================================================================
#  LIGHT THEME
# ====================================================================

[Light.Backgrounds]
BG0       = #eff0f2ff  # base app background
BG1       = #ffffffff  # panel backgrounds
BG2       = #e9ebeeff  # hover state
BG3       = #d8dbe0ff  # active / selected

[Light.Borders]
BORDER    = #c7ccd2ff  # default border
BORDER_HI = #8b96a5ff  # focused / highlighted border

[Light.Text]
TEXT0     = #1d2127ff  # primary text
TEXT1     = #535a65ff  # secondary text
TEXT2     = #8b929dff  # muted / disabled labels

[Light.EntityAccents]
C_SCENE   = #255dcaff  # scenes
C_NPC     = #ba3460ff  # characters / NPCs
C_ITEM    = #148762ff  # objects / items
C_PUZZLE  = #b06d16ff  # puzzles
C_VAR     = #6d49c4ff  # variables
C_AUDIO   = #bc4a1bff  # audio
C_STATE   = #49872bff  # states
C_CHAIN   = #168792ff  # state chains

[Light.StateIndicators]
C_ERROR   = #c42626ff  # error
C_WARN    = #af6700ff  # warning
C_OK      = #148762ff  # ok / success

[Light.Dialogs]
C_DIALOG_TITLE = #b4cdeeff  # modal caption bar
C_PANEL_TITLE  = #c9daf2ff  # docked panel caption + dock tab
C_CAPTION_TEXT = #1d2127ff  # text on the caption bars
